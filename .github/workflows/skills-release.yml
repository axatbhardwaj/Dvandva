name: Skills v4

on:
  push:
    branches:
      - "**"
    tags:
      - "skills-v*"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install release-test tooling
        run: python3 -m pip install --disable-pip-version-check 'ruamel.yaml==0.18.16'
      - name: Verify v4 kernel
        run: |
          cargo fmt --manifest-path v4/Cargo.toml -- --check
          cargo clippy --manifest-path v4/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path v4/Cargo.toml --all-targets --locked
          cargo run --quiet --manifest-path v4/Cargo.toml --locked -- \
            probe --expected-schema dvandva.run.v2 --expected-role-api 2
      - name: Verify archived v3 remains intact
        # ee66a47 retired v3 instructions from the active README. These six
        # prose assertions are obsolete; retain every archived runtime test.
        run: |
          cargo test --manifest-path rust/dvandva/Cargo.toml --locked -- \
            --skip readme_contract::documents_action_aware_waits \
            --skip readme_contract::documents_dvandva_role_ownership_for_explainer_reviews \
            --skip readme_contract::documents_multipart_termination_review \
            --skip readme_contract::documents_preflight_role_invocation \
            --skip f5_human_surfacing_contract::readme_documents_the_f5_rule \
            --skip never_silent_stop_contract::readme_documents_the_watchdog_subcommand
      - name: Verify setup skill
        run: bash tests/skills/setup-dvandva.sh
      - name: Verify HTML deliverables
        run: bash tests/skills/html-deliverables.sh
      - name: Verify role skills
        run: bash tests/skills/role-skills.sh
      - name: Verify automatic run discovery
        run: bash tests/skills/discover.sh
      - name: Verify release packaging
        run: bash tests/skills/package-release.sh
      - name: Verify two-role canary
        run: bash tests/skills/two-role-canary.sh
      - name: Verify poll behaviour
        run: |
          bash tests/skills/poll.sh
          bash tests/skills/poll-errors.sh

  # Operational prerequisite: repository administrators protect skills-v* tags
  # from deletion or force-updates. This workflow verifies tag identity twice;
  # it does not configure repository tag-protection rules.
  release:
    if: startsWith(github.ref, 'refs/tags/skills-v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Select stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Verify release ref before packaging
        run: bash scripts/verify-skills-release-ref.sh "$GITHUB_REF_NAME" origin
      - name: Package the private kernel
        run: bash scripts/package-skills-release.sh "$GITHUB_REF_NAME" artifacts
      - name: Verify release ref before publication
        run: bash scripts/verify-skills-release-ref.sh "$GITHUB_REF_NAME" origin
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#skills-v}"
          gh release create "$GITHUB_REF_NAME" \
            artifacts/dvandva-kernel-linux-x86_64 \
            artifacts/SHA256SUMS \
            --verify-tag \
            --title "Dvandva skills $release_version" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
